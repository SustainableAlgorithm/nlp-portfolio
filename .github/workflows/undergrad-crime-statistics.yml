name: Undergraduate crime statistics tests

on:
  push:
    branches: [main, master]
    paths:
      - "undergrad-crime-statistics/**"
      - ".github/workflows/undergrad-crime-statistics.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "undergrad-crime-statistics/**"
      - ".github/workflows/undergrad-crime-statistics.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: undergrad-crime-statistics/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r undergrad-crime-statistics/requirements.txt
      - name: Run tests
        working-directory: undergrad-crime-statistics
        run: python -m pytest -q
