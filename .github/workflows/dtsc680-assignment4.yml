name: DTSC 680 Assignment 4 computer vision tests

on:
  push:
    branches: [main, master]
    paths:
      - "dtsc680/assignment4_computer_vision/**"
      - ".github/workflows/dtsc680-assignment4.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "dtsc680/assignment4_computer_vision/**"
      - ".github/workflows/dtsc680-assignment4.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: dtsc680/assignment4_computer_vision/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r dtsc680/assignment4_computer_vision/requirements.txt
      - name: Run computer vision tests
        working-directory: dtsc680/assignment4_computer_vision
        run: python -m pytest -q
