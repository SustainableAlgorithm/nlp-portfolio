name: DTSC 660 SQL and data workflow tests

on:
  push:
    branches: [main, master]
    paths:
      - "dtsc660/**"
      - ".github/workflows/dtsc660-tests.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "dtsc660/**"
      - ".github/workflows/dtsc660-tests.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: dtsc660/python-postgres/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r dtsc660/python-postgres/requirements.txt pytest
      - name: Run DTSC 660 tests
        run: python -m pytest -q dtsc660/tests
